#@TYPE: Distribution
#@NAME: RADAE Distribution
#@DESCRIPTION: Linux distribution configuration for RADAE on i.MX 8M Plus
#@MAINTAINER: RADAE Team

require conf/distro/poky.conf

DISTRO = "radae-distro"
DISTRO_NAME = "RADAE Distribution"
DISTRO_VERSION = "1.0.0"
DISTRO_CODENAME = "kirkstone-radae"

MAINTAINER = "RADAE Team <radae@example.com>"

# Target distribution name
TARGET_VENDOR = "-radae"

# SDK configuration
SDK_VENDOR = "-radaesdk"
SDK_VERSION = "${DISTRO_VERSION}"
SDK_NAME = "${DISTRO}-${TCLIBC}-${SDKMACHINE}-${IMAGE_BASENAME}-${TUNE_PKGARCH}-${MACHINE}"
SDKPATHINSTALL = "/opt/${DISTRO}/${SDK_VERSION}"

# Distribution features
DISTRO_FEATURES:append = " \
    systemd \
    wayland \
    opengl \
    pulseaudio \
    pam \
    wifi \
    bluetooth \
"

DISTRO_FEATURES:remove = "x11 sysvinit"

# Use systemd as init manager
VIRTUAL-RUNTIME_init_manager = "systemd"
VIRTUAL-RUNTIME_initscripts = "systemd-compat-units"
VIRTUAL-RUNTIME_login_manager = "shadow-base"
VIRTUAL-RUNTIME_dev_manager = "systemd"

# Machine Learning and NPU features
DISTRO_FEATURES:append = " \
    ml \
    npu \
    tensorflow-lite \
"

# Networking features
DISTRO_FEATURES:append = " \
    ipv4 \
    ipv6 \
    nfs \
"

# Security features
DISTRO_FEATURES:append = " \
    seccomp \
"

# Preferred versions
PREFERRED_VERSION_tensorflow-lite ?= "2.12.%"
PREFERRED_VERSION_python3 ?= "3.10.%"
PREFERRED_VERSION_python3-native ?= "3.10.%"

# Toolchain configuration
TCLIBC = "glibc"
TCMODE = "default"

# GCC optimization
FULL_OPTIMIZATION = "-O2 -pipe ${DEBUG_FLAGS}"
BUILD_OPTIMIZATION = "-O2 -pipe"

# ARM-specific optimizations
GCCPIE = "--enable-default-pie"

# Package management
PACKAGE_CLASSES ?= "package_rpm"
EXTRA_IMAGE_FEATURES ?= "debug-tweaks package-management"

# Disable static libraries by default
DISABLE_STATIC = ""

# Localization
IMAGE_LINGUAS ?= "en-us"

# Time zone
DEFAULT_TIMEZONE = "UTC"

# RADAE-specific distro configuration
RADAE_DISTRO_FEATURES = "encoder decoder real-time npu-acceleration"

# Python support
DISTRO_FEATURES:append = " python3"

# Required Python packages for RADAE
RDEPENDS:${PN}:append = " \
    python3-core \
    python3-numpy \
    python3-scipy \
    python3-tflite-runtime \
"

# Audio support
DISTRO_FEATURES:append = " alsa"

# Real-time kernel options (optional)
# PREFERRED_PROVIDER_virtual/kernel = "linux-imx-rt"
# RT_KERNEL_ENABLED = "1"

# License configuration
LICENSE_FLAGS_ACCEPTED:append = " \
    commercial \
    commercial_imx-gpu-viv \
    commercial_imx-npu \
    commercial_multimedia \
"

# Image configurations
IMAGE_ROOTFS_SIZE ?= "8192"
IMAGE_ROOTFS_EXTRA_SPACE:append = "${@bb.utils.contains("DISTRO_FEATURES", "systemd", " + 4096", "", d)}"

# Package feed configuration
PACKAGE_FEED_URIS = ""
PACKAGE_FEED_BASE_PATHS = "rpm"
PACKAGE_FEED_ARCHS = "all ${MACHINE_ARCH}"

# Error reporting
# INHERIT += "report-error"
# ERR_REPORT_SERVER = "errors.yoctoproject.org"
# ERR_REPORT_PORT = "80"
# ERR_REPORT_DIR = "send-error-report"

# Source mirror
# INHERIT += "own-mirrors"
# SOURCE_MIRROR_URL ?= "http://example.com/source-mirror/"
# SSTATE_MIRRORS ?= "file://.* http://example.com/sstate-mirror/PATH"

# QA checks
WARN_QA:append = " textrel"
ERROR_QA:remove = "version-going-backwards"

# Build performance
BB_NUMBER_THREADS ?= "${@oe.utils.cpu_count()}"
PARALLEL_MAKE ?= "-j ${@oe.utils.cpu_count()}"

# Hash equivalence
BB_HASHSERVE = "auto"
BB_SIGNATURE_HANDLER = "OEEquivHash"

# RADAE application defaults
RADAE_DEFAULT_BACKEND = "npu"
RADAE_DEFAULT_PRECISION = "fp16"
RADAE_DEFAULT_THREADS = "4"

# Systemd services for RADAE
SYSTEMD_AUTO_ENABLE = "enable"

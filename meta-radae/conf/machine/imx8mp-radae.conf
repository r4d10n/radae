#@TYPE: Machine
#@NAME: NXP i.MX 8M Plus RADAE
#@SOC: i.MX8MP
#@DESCRIPTION: Machine configuration for i.MX 8M Plus with RADAE support
#@MAINTAINER: RADAE Team

MACHINEOVERRIDES =. "mx8mp:"

# Include the base i.MX 8M Plus machine configuration
require conf/machine/imx8mp-lpddr4-evk.conf

# Machine name
MACHINE_NAME = "imx8mp-radae"

# Hardware features
MACHINE_FEATURES += "npu gpu wifi bluetooth alsa"
MACHINE_FEATURES += "ext4 vfat"

# Graphics backend
DISTRO_FEATURES:append = " wayland"
DISTRO_FEATURES:remove = "x11"

# NPU Support - Enable Neural Processing Unit
MACHINE_FEATURES:append = " verisilicon-npu"
MACHINE_HAS_VIVANTE_KERNEL_DRIVER_SUPPORT = "1"

# GPU Configuration
IMX_GPU_VERSION = "6.4.11.p2.0"
PREFERRED_PROVIDER_virtual/egl = "imx-gpu-viv"
PREFERRED_PROVIDER_virtual/libgles1 = "imx-gpu-viv"
PREFERRED_PROVIDER_virtual/libgles2 = "imx-gpu-viv"
PREFERRED_PROVIDER_virtual/libgl = "imx-gpu-viv"
PREFERRED_PROVIDER_virtual/libg2d = "imx-gpu-g2d"

# NPU Configuration
PREFERRED_PROVIDER_virtual/libnpu = "imx-npu"
NPU_TOOLS_ENABLE = "1"

# TensorFlow Lite configuration
PACKAGECONFIG:append:pn-tensorflow-lite = " vx-delegate xnnpack"

# Kernel configuration
PREFERRED_PROVIDER_virtual/kernel = "linux-imx"
KERNEL_DEVICETREE = " \
    freescale/imx8mp-evk.dtb \
    freescale/imx8mp-evk-dsp.dtb \
"

# Kernel modules for RADAE
MACHINE_ESSENTIAL_EXTRA_RDEPENDS += " \
    kernel-module-imx-gpu-viv \
    kernel-module-galcore \
"

# U-Boot configuration
PREFERRED_PROVIDER_u-boot = "u-boot-imx"
PREFERRED_PROVIDER_virtual/bootloader = "u-boot-imx"
UBOOT_CONFIG ??= "sd"
UBOOT_CONFIG[sd] = "imx8mp_evk_defconfig,sdcard"
SPL_BINARY = "spl/u-boot-spl.bin"

# Image boot files
IMAGE_BOOT_FILES = " \
    ${KERNEL_IMAGETYPE} \
    ${KERNEL_DEVICETREE} \
"

# Serial console
SERIAL_CONSOLES = "115200;ttymxc1"

# Root filesystem type
IMAGE_FSTYPES = "tar.bz2 wic.bz2 wic.bmap"
WKS_FILE = "imx-imx-boot-bootpart.wks.in"

# Extra firmware
MACHINE_FIRMWARE:append = " firmware-imx-vpu-imx8 firmware-imx-sdma-imx7d"

# RADAE-specific packages to include in the image
MACHINE_EXTRA_RDEPENDS += " \
    imx-gpu-viv \
    imx-gpu-sdk \
    imx-npu \
    tensorflow-lite \
    python3-tflite-runtime \
"

# Audio configuration for RADAE
MACHINE_FEATURES += "alsa"
MACHINE_EXTRA_RDEPENDS += " \
    alsa-utils \
    alsa-lib \
    alsa-plugins \
"

# DSP Support (optional, for future use)
MACHINE_FEATURES += "dsp"

# RADAE optimization flags
RADAE_ARCH_FLAGS = "-march=armv8.2-a+fp16+simd -mtune=cortex-a53"
RADAE_NPU_BACKEND = "vsi"
RADAE_ENABLE_DSP = "0"

# CPU configuration
DEFAULTTUNE = "cortexa53-crypto"

# Additional tools for development
EXTRA_IMAGE_FEATURES += "tools-debug ssh-server-openssh"

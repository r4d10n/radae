# We have a conf and classes directory, add to BBPATH
BBPATH .= ":${LAYERDIR}"

# We have recipes-* directories, add to BBFILES
BBFILES += "${LAYERDIR}/recipes-*/*/*.bb \
            ${LAYERDIR}/recipes-*/*/*.bbappend"

BBFILE_COLLECTIONS += "meta-radae"
BBFILE_PATTERN_meta-radae = "^${LAYERDIR}/"
BBFILE_PRIORITY_meta-radae = "10"

# Layer version
LAYERVERSION_meta-radae = "1"
LAYERSERIES_COMPAT_meta-radae = "kirkstone langdale mickledore nanbield scarthgap"

# Layer dependencies
LAYERDEPENDS_meta-radae = " \
    core \
    freescale-layer \
    openembedded-layer \
    meta-python \
    meta-ml \
"

# Layer recommendations (optional but useful)
LAYERRECOMMENDS_meta-radae = " \
    freescale-3rdparty \
"

# License handling
LICENSE_PATH += "${LAYERDIR}/licenses"

# Additional paths
BBFILES += "${LAYERDIR}/recipes-*/*/*.inc"

# Default preferred versions
PREFERRED_VERSION_radae-npu ?= "1.0"
PREFERRED_VERSION_radae-npu-test ?= "1.0"

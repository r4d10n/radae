# RADAE Test Configuration
# Configuration for testing and debugging

[audio]
sample_rate = 16000
channels = 1
period_size = 160
buffer_size = 1600
capture_device = "hw:0,0"
playback_device = "hw:0,0"

[ofdm]
sample_rate = 8000
num_carriers = 30
symbol_rate = 50
cp_length = 0.002
pilot_spacing = 4

[npu]
enable = 1
encoder_model = "/usr/share/radae/radae_encoder_int8.tflite"
decoder_model = "/usr/share/radae/radae_decoder_int8.tflite"
num_threads = 2

[ptt]
enable = 0
gpio_chip = "gpiochip0"
gpio_line = 12
active_low = 0
delay_ms = 100

[logging]
level = "debug"     # Verbose logging for debugging
file = "/var/log/radae/radae.log"

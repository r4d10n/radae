# RADAE Low-Latency Configuration
# Optimized for minimum end-to-end latency

[audio]
sample_rate = 16000
channels = 1
period_size = 80    # 5ms periods for lower latency
buffer_size = 800   # Smaller buffer
capture_device = "hw:0,0"
playback_device = "hw:0,0"

[ofdm]
sample_rate = 8000
num_carriers = 30
symbol_rate = 100   # Higher symbol rate
cp_length = 0.001   # Shorter CP
pilot_spacing = 3

[npu]
enable = 1
encoder_model = "/usr/share/radae/radae_encoder_int8.tflite"
decoder_model = "/usr/share/radae/radae_decoder_int8.tflite"
num_threads = 4     # Use all cores

[ptt]
enable = 0
gpio_chip = "gpiochip0"
gpio_line = 12
active_low = 0
delay_ms = 50       # Shorter PTT delay

[logging]
level = "warning"   # Less logging for performance
file = "/var/log/radae/radae.log"

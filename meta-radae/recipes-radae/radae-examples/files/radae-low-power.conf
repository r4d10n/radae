# RADAE Low-Power Configuration
# Optimized for battery-powered operation

[audio]
sample_rate = 16000
channels = 1
period_size = 320   # 20ms periods (less frequent wakeups)
buffer_size = 3200  # Larger buffer
capture_device = "hw:0,0"
playback_device = "hw:0,0"

[ofdm]
sample_rate = 8000
num_carriers = 20   # Fewer carriers
symbol_rate = 40    # Lower symbol rate
cp_length = 0.003
pilot_spacing = 5

[npu]
enable = 1
encoder_model = "/usr/share/radae/radae_encoder_int8.tflite"
decoder_model = "/usr/share/radae/radae_decoder_int8.tflite"
num_threads = 2     # Fewer threads

[ptt]
enable = 0
gpio_chip = "gpiochip0"
gpio_line = 12
active_low = 0
delay_ms = 200      # Longer delay acceptable

[logging]
level = "error"     # Minimal logging
file = "/var/log/radae/radae.log"

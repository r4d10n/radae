# RADAE System Configuration
# This file is sourced by systemd service units

# Audio Configuration
AUDIO_DEVICE="hw:0,0"
AUDIO_SAMPLE_RATE=16000
AUDIO_PERIOD_SIZE=160

# OFDM Configuration
OFDM_CARRIERS=30
OFDM_SYMBOL_RATE=50

# NPU Configuration
NPU_ENABLE=1
NPU_THREADS=2

# PTT Configuration
PTT_ENABLE=0
PTT_GPIO_CHIP="gpiochip0"
PTT_GPIO_LINE=12
PTT_ACTIVE_LOW=0
PTT_DELAY_MS=100

# CPU Governor (performance, ondemand, powersave)
CPU_GOVERNOR="performance"

# Logging
LOG_LEVEL="info"
LOG_FILE="/var/log/radae/radae.log"

# Watchdog
WATCHDOG_ENABLE=1
WATCHDOG_INTERVAL=10
